<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spoken AI Studio</title><style>:root{font-family:Inter,system-ui;color:#f4ead8;background:#110f13}body{max-width:980px;margin:auto;padding:20px}h1{margin-bottom:4px}.lede{color:#cdbfd0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#211c25;border:1px solid #46384c;border-radius:14px;padding:16px;margin:14px 0}.participant{border-top:5px solid var(--accent,#cf6)}label{display:block;margin:9px 0;font-size:.9rem;color:#dfd1e2}input,select,textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:9px;border-radius:8px;border:1px solid #67566e;background:#17131a;color:#fff}button{width:auto;background:#b5384f;border:0;font-weight:700;cursor:pointer;margin:4px}.primary{font-size:1.08rem;padding:12px 22px}.controls{display:none;position:sticky;top:8px;z-index:2}.turn{border-left:6px solid var(--accent);padding:14px;margin:12px 0;background:#211c25;border-radius:8px}.speaking{box-shadow:0 0 0 3px #ffd166}.meta{font-size:.78rem;color:#bbaabd}.error{color:#ff8e9e}#third{display:none}@media(max-width:600px){body{padding:10px}.controls button{width:46%}}</style><body><h1>Spoken AI Studio</h1><p class="lede">Unscripted, personality-driven conversations. Debate is one format—not the engine.</p><form id="setup" class="card"><div class="grid"><label>FORMAT<select id="format"><option>INTERVIEW</option><option>DEBATE</option><option>PANEL</option><option>CROSS_EXAMINATION</option></select></label><label>STYLE<select id="style"><option>SATIRICAL</option><option>SERIOUS</option><option>FRIENDLY</option><option>INVESTIGATIVE</option><option>ABSURDIST</option></select></label></div><label>TOPIC / PREMISE<textarea id="premise" rows="3">Why does your Institute for Forward Pavements believe every town needs a Department of Strategic Queuing?</textarea></label><label>SHORT QUALIFICATION<select id="turnLimit"><option value="4" selected>4 turns — opening, answer, dynamic follow-up, reply</option><option value="8">8 turns</option><option value="12">12 turns</option></select></label><div class="grid"><section id="first" class="card participant" style="--accent:#63d2ff"><h2></h2><label>MODEL<select class="model"></select></label><label>PERSONALITY<select class="personality"></select></label><label>VOICE<select class="voice"></select></label><button type="button" class="preview">Preview voice</button></section><section id="second" class="card participant" style="--accent:#ff6b9a"><h2></h2><label>MODEL<select class="model"></select></label><label>PERSONALITY<select class="personality"></select></label><label>VOICE<select class="voice"></select></label><button type="button" class="preview">Preview voice</button></section><section id="third" class="card participant" style="--accent:#ffd166"><h2></h2><label>MODEL<select class="model"></select></label><label>PERSONALITY<select class="personality"></select></label><label>VOICE<select class="voice"></select></label><button type="button" class="preview">Preview voice</button></section></div><button type="button" id="editProfile">Create / edit saved personality</button><button class="primary" id="start">START INTERVIEW</button><p id="setupError" class="error" role="alert"></p></form><section id="controls" class="card controls"><b id="status">READY</b><button id="pause">Pause</button><button id="resume">Resume</button><button id="skip">Skip speech</button><button id="stop">Stop</button><a id="jsonExport">Export JSON</a> · <a id="mdExport">Export Markdown</a></section><main id="transcript" aria-live="polite"></main><script src="polyfills.js"></script><script src="show.js"></script></body></html>
