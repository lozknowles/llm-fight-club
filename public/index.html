<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLM Fight Club</title><style>body{max-width:900px;margin:auto;padding:1rem;font:16px system-ui;background:#15110e;color:#f6ead6}input,select,button,textarea{font:inherit;padding:.55rem;margin:.2rem}input,textarea{width:95%}button{background:#e76f51;border:0;border-radius:6px;color:#fff;font-weight:bold}.card{padding:1rem;margin:.7rem 0;background:#28201b;border-radius:10px}.for{border-left:6px solid #4cc9f0}.against{border-left:6px solid #f72585}.referee{border-left:6px solid #ffd166}#controls{display:none}#status{font-weight:bold}small{color:#cab9a5}</style><body>
<h1>LLM Fight Club</h1><p>Turn-based TTS debate: spoken arguments, one turn at a time.</p>
<form id="setup" class="card"><label>Proposition<input name="proposition" required value="Open-source local language models will eventually replace most cloud LLM usage."></label><label>Style<select name="format"><option>SERIOUS</option><option>PUB</option><option>PARLIAMENT</option><option>DEVILS_ADVOCATE</option><option>INCREASINGLY_IRRITATED</option></select></label><label>Rounds<select name="rounds"><option>1</option><option selected>2</option><option>3</option></select></label><fieldset><legend>FOR</legend><input name="forModel" value="qwen3-8b"><input name="forVoice" value="EN-BR"><input name="forPersonality" value="a confident data nerd"></fieldset><fieldset><legend>AGAINST</legend><input name="againstModel" value="qwen3-8b"><input name="againstVoice" value="EN-US"><input name="againstPersonality" value="a polite but devastating barrister"></fieldset><label><input type="checkbox" name="referee" checked> Referee</label><fieldset><legend>REFEREE</legend><input name="refereeModel" value="qwen3-8b"><input name="refereeVoice" value="EN-AU"><input name="refereePersonality" value="an exasperated broadcaster"></fieldset><button>FIGHT!</button></form>
<section id="controls" class="card"><span id="status"></span><button id="pause">Pause</button><button id="resume">Resume</button><button id="skip">Skip speech</button><button id="stop">Stop</button><label>Throw a Grenade <small>(audience intervention)</small><textarea id="grenade" placeholder="A question both sides must address"></textarea><button id="throw">Throw</button></label><p><small>Transcript is saved turn-by-turn on the server, including speaker, model, voice, text and timing.</small></p></section><main id="transcript"></main><audio id="audio"></audio><script src="app.js"></script></body></html>
