<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spoken AI Studio — Server Audio</title>
<style>
  :root{font-family:Inter,system-ui;color:#f4ead8;background:#110f13}
  body{max-width:980px;margin:auto;padding:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .card{background:#211c25;border:1px solid #46384c;border-radius:14px;padding:16px;margin:14px 0}
  .participant{border-top:5px solid var(--accent,#cf6)}
  label{display:block;margin:9px 0;color:#dfd1e2}
  input,select,textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:9px;border-radius:8px;border:1px solid #67566e;background:#17131a;color:#fff}
  button{width:auto;background:#b5384f;border:0;font-weight:700;cursor:pointer;margin:4px}
  .primary{font-size:1.08rem;padding:12px 22px}
  .controls{display:none;position:sticky;top:8px;z-index:2}
  .turn{border-left:6px solid var(--accent);padding:14px;margin:12px 0;background:#211c25;border-radius:8px}
  .speaking{box-shadow:0 0 0 3px #ffd166}
  .meta{font-size:.78rem;color:#bbaabd}
  .personality-summary{min-height:2.3em;margin:6px 0 8px}
  .error{color:#ff8e9e}
  .archive-player{margin-top:12px;padding-top:12px;border-top:1px solid #46384c}
  .archive-player audio{width:100%;margin-top:8px}
  .grenade{margin-top:14px;padding-top:12px;border-top:1px solid #46384c}
  .grenade h3{margin:0 0 5px}
  .intervention{border-left:6px solid #ff9f1c;padding:10px 12px;margin:8px 0;background:#30251d;border-radius:8px}
  #third{display:none}
  @media(max-width:600px){body{padding:10px}.controls button{width:46%}}
</style>
<body>
  <h1>Spoken AI Studio</h1>
  <p>AI-generated synthetic voices · turn-based audio · unscripted personalities</p>
  <form id="setup" class="card">
    <div class="grid">
      <label>FORMAT<select id="format"><option>INTERVIEW</option><option>DEBATE</option><option>PANEL</option><option>CROSS_EXAMINATION</option></select></label>
      <label>STYLE<select id="style"><option>SATIRICAL</option><option>SERIOUS</option><option>FRIENDLY</option><option>INVESTIGATIVE</option><option>ABSURDIST</option></select></label>
      <label>DELIVERY<select id="delivery"><option selected>PASSIONATE</option><option>BALANCED</option><option>RESTRAINED</option></select></label>
    </div>
    <label>TOPIC / PREMISE<textarea id="premise" rows="3">Why does your Institute for Forward Pavements believe every town needs a Department of Strategic Queuing?</textarea></label>
    <label>LENGTH (TURNS, 2–40)<input id="turnLimit" type="number" min="2" max="40" step="1" value="4"></label>
    <div class="grid">
      <section id="first" class="card participant" style="--accent:#63d2ff">
        <h2></h2>
        <label>MODEL<select class="model"></select></label>
        <label>PERSONALITY<select class="personality"></select></label>
        <p class="personality-summary meta"></p>
        <label>PERSONALITY PROMPT (OPTIONAL)<textarea class="personality-prompt" rows="4" maxlength="1200" placeholder="Add original character direction: worldview, objectives, blind spots, confidence, humour, verbal habits, contradictions…"></textarea></label>
        <label>VOICE<select class="voice"></select></label>
        <label>VOICE SPEED<select class="speech-rate"><option value="0.75">Slow · 0.75×</option><option value="0.9">Relaxed · 0.90×</option><option value="1" selected>Natural · 1.00×</option><option value="1.1">Brisk · 1.10×</option><option value="1.25">Fast · 1.25×</option></select></label>
        <button type="button" class="preview">Preview</button>
      </section>
      <section id="second" class="card participant" style="--accent:#ff6b9a">
        <h2></h2>
        <label>MODEL<select class="model"></select></label>
        <label>PERSONALITY<select class="personality"></select></label>
        <p class="personality-summary meta"></p>
        <label>PERSONALITY PROMPT (OPTIONAL)<textarea class="personality-prompt" rows="4" maxlength="1200" placeholder="Add original character direction: worldview, objectives, blind spots, confidence, humour, verbal habits, contradictions…"></textarea></label>
        <label>VOICE<select class="voice"></select></label>
        <label>VOICE SPEED<select class="speech-rate"><option value="0.75">Slow · 0.75×</option><option value="0.9">Relaxed · 0.90×</option><option value="1" selected>Natural · 1.00×</option><option value="1.1">Brisk · 1.10×</option><option value="1.25">Fast · 1.25×</option></select></label>
        <button type="button" class="preview">Preview</button>
      </section>
      <section id="third" class="card participant" style="--accent:#ffd166">
        <h2></h2>
        <label>MODEL<select class="model"></select></label>
        <label>PERSONALITY<select class="personality"></select></label>
        <p class="personality-summary meta"></p>
        <label>PERSONALITY PROMPT (OPTIONAL)<textarea class="personality-prompt" rows="4" maxlength="1200" placeholder="Add original character direction: worldview, objectives, blind spots, confidence, humour, verbal habits, contradictions…"></textarea></label>
        <label>VOICE<select class="voice"></select></label>
        <label>VOICE SPEED<select class="speech-rate"><option value="0.75">Slow · 0.75×</option><option value="0.9">Relaxed · 0.90×</option><option value="1" selected>Natural · 1.00×</option><option value="1.1">Brisk · 1.10×</option><option value="1.25">Fast · 1.25×</option></select></label>
        <button type="button" class="preview">Preview</button>
      </section>
    </div>
    <button class="primary">START INTERVIEW</button>
    <p id="error" class="error" role="alert"></p>
  </form>
  <section id="controls" class="card controls">
    <b id="status"></b>
    <button id="pause">Pause</button>
    <button id="resume">Resume</button>
    <button id="skip">Skip speech</button>
    <button id="stop">Stop</button>
    <a id="jsonExport">JSON</a> · <a id="mdExport">Markdown</a> · <a id="audioExport" hidden download="conversation.mp3">Conversation MP3</a>
    <div class="grenade">
      <h3>Throw a Grenade</h3>
      <p class="meta">Interrupt with a curve ball. Playback stops and every participant must address it on their next turn.</p>
      <textarea id="grenadeText" rows="2" maxlength="500" placeholder="Type a curve ball comment or question…"></textarea>
      <button type="button" id="grenadeMic">🎙 Speak</button>
      <button type="button" id="grenadeThrow">Throw Grenade</button>
      <span id="grenadeStatus" class="meta" role="status"></span>
      <div id="grenadeHistory"></div>
    </div>
    <div id="archivePlayback" class="archive-player" hidden>
      <label>WHOLE CONVERSATION PLAYBACK SPEED
        <select id="archivePlaybackRate"><option value="0.75">0.75×</option><option value="1" selected>1.00×</option><option value="1.25">1.25×</option><option value="1.5">1.50×</option><option value="2">2.00×</option></select>
      </label>
      <audio id="archivePlayer" controls preload="metadata"></audio>
    </div>
  </section>
  <main id="transcript" aria-live="polite"></main>
  <audio id="player" preload="auto"></audio>
  <script src="polyfills.js"></script>
  <script type="module" src="audio.js"></script>
</body>
</html>
